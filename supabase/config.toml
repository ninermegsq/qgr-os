# Configuracao local do Supabase (usada pelo CLI: supabase start / functions deploy)
# O projeto real e o rppoiwrbxqdbtavhgdjk.

project_id = "rppoiwrbxqdbtavhgdjk"

[functions.noticias]
# O feed e publico: a RLS do banco garante que so sai noticia publicada.
verify_jwt = false

[functions.cotacoes-trigger]
# O TOKEN E CONFERIDO DENTRO DA FUNCAO, NAO NO GATEWAY.
#
# Com verify_jwt = true, o gateway do Supabase exige o JWT em TODAS as
# requisicoes - inclusive no preflight OPTIONS do CORS, que nunca leva
# o cabecalho Authorization. O navegador aborta a requisicao antes do
# POST e o painel so ve "Failed to fetch", sem status nenhum.
#
# Com verify_jwt = false, o preflight passa e chega na funcao. A
# seguranca continua inteira: a propria funcao exige o Bearer, valida
# a sessao em /auth/v1/user e so dispara a coleta para quem esta com
# ativo = true na tabela administradores (401/403 caso contrario).
verify_jwt = false
